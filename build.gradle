plugins {
    id 'com.android.library'
    id 'maven-publish'
}

// Java-only 4.2.x maintenance line. The Kotlin SDK ships separately as the
// 5.0.0 line (main branch). This branch publishes the legacy Java API as
// com.github.inngage:inngage-lib:<tag> so existing Java consumers can stay on 4.x.
android {
    namespace 'br.com.inngage.sdk'
    compileSdk 36

    defaultConfig {
        minSdk 21
        targetSdk 36
        versionCode 3
        versionName "4.2.2"

        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
    }

    // Required so `components.release` exists for maven-publish (AGP 8),
    // and so the published -sources.jar is built from THIS source tree.
    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    // AndroidX (non-ktx variants — this is a Java-only artifact)
    implementation 'androidx.core:core:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.browser:browser:1.7.0'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // WorkManager + ListenableWorker
    implementation 'androidx.work:work-runtime:2.9.0'
    implementation 'androidx.concurrent:concurrent-futures:1.1.0'

    // Firebase (via BOM) — Cloud Messaging + Analytics
    implementation platform('com.google.firebase:firebase-bom:34.11.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-analytics'

    // Google Play Services Location (geolocation on subscribe)
    implementation 'com.google.android.gms:play-services-location:21.0.1'

    // In-App carousel + image loading
    implementation 'com.github.denzcoskun:ImageSlideShow:0.1.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}

// Publishing — consumed by JitPack (builds this repo standalone and serves the
// AAR as com.github.inngage:inngage-lib:<tag>). JitPack overrides the coordinates
// with the requested tag; the values below make local `publishToMavenLocal` work.
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.inngage'
                artifactId = 'inngage-lib'
                version = android.defaultConfig.versionName
            }
        }
    }
}
